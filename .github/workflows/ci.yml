name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application
        run: python -c "from app.main import app; print('Application loaded successfully')"

      - name: Run tests
        run: python -m pytest

      - name: Create application artifact
        run: | 
          zip -r employee-api.zip app requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-api
          path: employee-api.zip